{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Inscription</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Créer mon compte</button>
        </div>
    </form>
    <p>Vous avez déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
</div>
{% endblock %}
