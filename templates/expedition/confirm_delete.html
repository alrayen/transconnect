{% extends 'base.html' %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Confirmer la suppression</h1>
    <p>Voulez-vous vraiment supprimer l'expédition <strong>{{ exp.reference }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn-danger">Oui, supprimer</button>
            <a class="btn btn-light" href="{% url 'expeditions:expedition_detail' exp.pk %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
