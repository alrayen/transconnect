<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Confirm Delete</title>
    </head>
    <body>
        <h1>Confirm Delete</h1>
        <p>Are you sure you want to delete this expedition?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, delete</button>
            <a href="{% url 'expedition_detail' exp.pk %}">Cancel</a>
        </form>
    </body>
</html>
