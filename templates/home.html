{% extends 'base.html' %}

{% block title %}Accueil{% endblock %}

{% block content %}
<h1>Bienvenue{% if user.is_authenticated %} {{ user.username }}{% endif %}</h1>

<div class="stats">
    <a class="stat" href="{% url 'entreprises:entreprise_list' %}">
        <span class="stat-number">{{ nb_entreprises }}</span>
        Entreprises
    </a>
    <a class="stat" href="{% url 'vehicules:vehicule_list' %}">
        <span class="stat-number">{{ nb_vehicules }}</span>
        Véhicules
    </a>
    <a class="stat" href="{% url 'offres:offre_list' %}">
        <span class="stat-number">{{ nb_offres }}</span>
        Offres
    </a>
    <a class="stat" href="{% url 'expeditions:expedition_list' %}">
        <span class="stat-number">{{ nb_expeditions }}</span>
        Expéditions
    </a>
</div>
{% endblock %}
