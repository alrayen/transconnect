{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Connexion</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="actions">
            <button type="submit">Se connecter</button>
        </div>
    </form>
    <p>Pas encore de compte ? <a href="{% url 'inscription' %}">Créer un compte</a></p>
</div>
{% endblock %}
