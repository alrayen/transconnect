{% extends 'base.html' %}

{% block title %}Changer mon mot de passe{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Changer mon mot de passe</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Changer le mot de passe</button>
            <a class="btn btn-light" href="{% url 'profil' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
