{% extends 'base.html' %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Confirmer la suppression</h1>
    <p>Voulez-vous vraiment supprimer l'offre <strong>{{ off.pk }}</strong> ({{ off.expedition.reference }} - {{ off.entreprise.raison_sociale }}) ?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn-danger">Oui, supprimer</button>
            <a class="btn btn-light" href="{% url 'offres:offre_detail' off.pk %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
