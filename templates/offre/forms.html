{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} une offre{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>{% if form.instance.pk %}Modifier l'offre{% else %}Créer une nouvelle offre{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">{% if form.instance.pk %}Modifier{% else %}Créer{% endif %}</button>
            <a class="btn btn-light" href="{% url 'offres:offre_list' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
