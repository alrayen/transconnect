{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Modifier{% else %}Créer{% endif %} un véhicule{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>{% if form.instance.pk %}Modifier le véhicule{% else %}Créer un nouveau véhicule{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">{% if form.instance.pk %}Modifier{% else %}Créer{% endif %}</button>
            <a class="btn btn-light" href="{% url 'vehicules:vehicule_list' %}">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
